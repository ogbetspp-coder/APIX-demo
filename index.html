<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APIX × PQI — FDA Pharmaceutical Quality Supplement Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============================ HEADER (quiet) ============================ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-text">
        <h1>HL7 Vulcan · APIX × PQI</h1>
        <p>Structured submissions, tracked in real time</p>
      </div>
    </div>
    <div class="header-tools">
      <div class="backend" id="backend-toggle" role="group" aria-label="Backend">
        <button class="backend-opt on" id="backend-mock">Mock</button>
        <button class="backend-opt" id="backend-local">Local</button>
        <button class="backend-opt" id="backend-live">Live</button>
      </div>
      <input class="local-base" id="local-base" type="text" spellcheck="false"
             aria-label="Local server base URL" value="http://localhost:8080/fhir" hidden>
      <span class="live-indicator" id="live-indicator" hidden>hapi.fhir.org/baseR5</span>
      <button class="tool-btn" id="inspect-toggle" aria-expanded="false" title="Technical detail — real FHIR R5 &amp; live API calls">
        Inspect <span class="io-count" id="io-count">0</span>
      </button>
      <button class="tool-btn" id="about-btn" title="About this demo / FDA context">About / FDA context</button>
      <button class="tool-btn" id="resetbtn" title="Start over">Reset</button>
    </div>
  </header>

  <!-- ===== breadcrumb: the only persistent progress indicator ===== -->
  <nav class="crumb" id="crumb" aria-label="Progress"></nav>

  <!-- ===== live/local server bar — visible "this runs on real FHIR" state ===== -->
  <div class="livebar" id="livebar" hidden></div>

  <!-- =========================== CENTERED BEAT STAGE ======================= -->
  <main class="stage" id="stage">
    <div class="beat" id="beat" aria-live="polite"></div>
  </main>

  <!-- =================== INSPECT slide-over (the ONLY place FHIR appears) === -->
  <aside class="inspect" id="inspect" hidden>
    <div class="inspect-head">
      <span class="inspect-title">Inspect</span>
      <button class="inspect-close" id="inspect-close">×</button>
    </div>
    <div class="inspect-body">
      <p class="inspect-tech-note">Technical detail — real FHIR R5.</p>
      <div class="inspect-focus" id="inspect-focus"></div>
      <div class="inspect-sec" id="audit-sec" hidden>Audit trail
        <span class="audit-count" id="audit-count">0</span></div>
      <div class="audit-note" id="audit-note" hidden><code>Provenance</code> · 21 CFR Part 11 / ALCOA</div>
      <div class="audit-wrap" id="audit-wrap" hidden></div>
      <div class="inspect-sec">API calls</div>
      <div class="io-list" id="io-list"></div>
    </div>
  </aside>

  <script src="js/highlight.js"></script>
  <script src="js/codesystems.js"></script>
  <script src="js/terminology.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fhir-server.js"></script>
  <script src="js/client.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/pqi.js"></script>
  <script src="js/scenario.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
